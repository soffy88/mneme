services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?需在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: mneme
    ports:
      # C4：仅本机可连，不暴露公网（生产在 127.0.0.1 上经 api 容器走内部网络）
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - mneme_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    # 开启 AOF 持久化，重启不丢队列/验证码/缓存
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - mneme_redis_data:/data

  minio:
    image: minio/minio
    restart: always
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?需在 .env 设置 MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - mneme_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    # 部署纪律（2026-07-09 事故修复）：启动先 alembic upgrade head 再起服务。
    # 之前迁移和重启全靠手动，导致"改了库、容器不重启、旧ORM引用已删列、每个
    # 请求都500"的26小时静默故障。现在迁移随启动执行，迁移失败则不对外提供服务。
    # 部署纪律 2（W4 S0 事故修复，2026-07-19）：sandbox_selfcheck 同理——S0
    # 沙箱加固 push 后，PYTHONPATH 一直不含 vendor/，生产装的是站点包里
    # 未加固的旧内核，没有任何东西在生产验证过加固真的生效。现在自检随启动
    # 执行，自检不过（vendor 未生效/装了旧副本/内核绕过沙箱）则不对外提供服务。
    # 从 /tmp 启动，避免工作目录 /app 下的仓根 oprim shim 抢在 vendor/oprim 前；
    # vendor 优先是 S0 自检与生产运行时一致性的必要条件。
    command: sh -c "cd /tmp && python -m obase.sandbox_selfcheck && alembic -c /app/alembic.ini upgrade head && uvicorn services.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # ②-0 打包：mneme-core（Phase1 门控内核 7 元素之家）加入 import 路径。
      # 现经 PYTHONPATH 验证整条链；稳定后再固化为 Dockerfile pip install（与 obase/oprim 平价）。
      # W4 S0：/app/vendor 加进最前面，让 oprim/oskill/omodul/obase 优先解析到
      # 本仓 vendor/ 副本（S0 沙箱加固 + Solve 模式所在），不再落到站点包
      # (site-packages) 里未加固的旧副本——这两者此前一直是两份不同代码。
      PYTHONPATH: /app/vendor:/app:/app/packages/mneme-core:/app/packages/mneme-agent:/app/packages/event-schema
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/mneme
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?需在 .env 设置 MINIO_SECRET_KEY}
      MINIO_BUCKET: mneme
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SMS_PROVIDER: mock
      # SMS_SIGN_NAME: ""        # 阿里云短信签名（报备后填写）
      # SMS_TEMPLATE_CODE: ""    # 阿里云短信模板CODE（报备后填写）
      # 邮箱注册验证码：默认 mock（打日志）。上线设 EMAIL_PROVIDER=smtp + 填任意
      # 免费邮件服务的 SMTP 凭据（推荐国内免费 QQ/163 邮箱授权码）。
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # 环境标记：默认 dev（prod-safety 门不武装，行为不变）。真上线时设成 prod，
      # _assert_prod_safety 才会拒绝"默认JWT密钥/mock短信"启动。此前 MNEME_ENV
      # 只在 .env 里、没进 compose，pydantic 丢弃，那道门永远处于 dev 态形同虚设。
      MNEME_ENV: ${MNEME_ENV:-dev}
      # API 与本地 CLI/pytest 必须使用同一签名密钥；生产环境由安全闸门拒绝默认值。
      JWT_SECRET: ${JWT_SECRET:-mneme-dev-secret-change-in-prod!}
      # Learning Event v2 is the canonical append-only fact stream.  The API
      # startup command applies migrations before this flag can write.
      LEARNING_EVENT_V2_DUAL_WRITE_ENABLED: ${LEARNING_EVENT_V2_DUAL_WRITE_ENABLED:-1}
      # 本机 Veya gateway：文本 veya1.2-128K、视觉 veya1.2-vl；
      # gateway 通过 host.docker.internal:8791 暴露 OpenAI-compatible API。
      MNEME_LLM: ${MNEME_LLM:-veya}
      VEYA_BASE_URL: ${VEYA_BASE_URL:-http://host.docker.internal:8791/v1}
      VEYA_API_KEY: ${VEYA_API_KEY:-}
      VEYA_MODEL: ${VEYA_MODEL:-veya1.2-128K}
      VEYA_VL_MODEL: ${VEYA_VL_MODEL:-veya1.2-vl}
      # 云端 Qwen 保留为显式 fallback（MNEME_LLM=qwen 时使用）。
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      QWEN_VL_MODEL: ${QWEN_VL_MODEL:-qwen-vl-max}
      # Knowledge Hub 自建检索（W3 Part A）：本地 Ollama embedding（qwen3-embedding），
      # OPENAI_API_KEY 未配时 embed_chunks.py 自动 fallback 到这条路径
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      # Stratum 检索接入（C4/W2C）：专用 service 账号（非用户个人账号），HTTP 走
      # docker network（mneme-api-1 已 connect stratum-net）。未配则 rag_client
      # 静默返回空列表，不阻断对话（呈现层素材，缺失不该打断）。
      STRATUM_BASE_URL: ${STRATUM_BASE_URL:-}
      STRATUM_SERVICE_EMAIL: ${STRATUM_SERVICE_EMAIL:-}
      STRATUM_SERVICE_PASSWORD: ${STRATUM_SERVICE_PASSWORD:-}
      # P3: EchoMimic V2 侧车（音频→半身视频）
      ECHO_BASE_URL: ${ECHO_BASE_URL:-http://echomimic:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    networks:
      - default
      - helios-net
      - stratum-net
    healthcheck:
      # /health 现在真打 DB（SELECT 1），不再是恒 ok 的静态桩——能反映真实就绪度。
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    # 部署纪律 2（同 api 服务同名注释）：worker 也直接调 oprim solve_* 内核
    # （tasks.paper_tasks 等），同样需要自检把关，不能只在 api 侧检查一次。
    command: sh -c "cd /tmp && python -m obase.sandbox_selfcheck && celery -A tasks.celery_app worker --loglevel=info --concurrency=2"
    environment:
      PYTHONPATH: /app/vendor:/app:/app/packages/mneme-core:/app/packages/mneme-agent:/app/packages/event-schema
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/mneme
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?需在 .env 设置 MINIO_SECRET_KEY}
      MINIO_BUCKET: mneme
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SMS_PROVIDER: mock
      # 与 api 一致：worker 的异步 OCR/变式也走本机 Veya。
      MNEME_LLM: ${MNEME_LLM:-veya}
      LEARNING_EVENT_V2_DUAL_WRITE_ENABLED: ${LEARNING_EVENT_V2_DUAL_WRITE_ENABLED:-1}
      VEYA_BASE_URL: ${VEYA_BASE_URL:-http://host.docker.internal:8791/v1}
      VEYA_API_KEY: ${VEYA_API_KEY:-}
      VEYA_MODEL: ${VEYA_MODEL:-veya1.2-128K}
      VEYA_VL_MODEL: ${VEYA_VL_MODEL:-veya1.2-vl}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      QWEN_VL_MODEL: ${QWEN_VL_MODEL:-qwen-vl-max}
      # Knowledge Hub 自建检索（W3 Part A）：textbook_tasks.py 的索引任务在 worker 里跑，
      # 同样需要 embedding provider 配置（见 api 服务同名注释）
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - default
      - helios-net

  # Celery beat：定时调度器（此前缺失 → 数据飞轮/FSRS 优化/AUC 评估/家长预警全休眠）。
  # 4 个 schedule 见 tasks/celery_app.py：每日3:30 BKT 校准 / 周一4:00 FSRS 优化 /
  # 周一5:00 护城河 AUC 评估 / 每日20:00 家长预警。
  # P3: EchoMimic V2 数字人驱动侧车（GPU 容器）
  # 按需启动：docker compose --profile gpu up echomimic
  # 或常驻：docker compose up echomimic
  echomimic:
    build:
      context: docker/echomimic
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: ["gpu"]  # 默认不启动，需要 GPU 时 --profile gpu
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ECHO_DEVICE: ${ECHO_DEVICE:-cuda}
      ECHO_HALF_BODY: ${ECHO_HALF_BODY:-1}
      ECHO_REF_IMAGE: /app/ref/aria_ref.jpg
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./public/aria/dh/person_play.png:/app/ref/aria_ref.jpg:ro
      - mneme_echo_output:/app/output
      - mneme_echo_cache:/app/cache
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # 模型加载慢

  beat:
    image: mneme-worker          # 复用 worker 镜像（同代码，经 .:/app 挂载），免单独构建
    restart: always
    # 部署纪律 2（同 api/worker）：beat 本身不直接调 solve_* 内核，但共用同一
    # PYTHONPATH/镜像，自检成本极低，统一加上不留死角。
    command: sh -c "cd /tmp && python -m obase.sandbox_selfcheck && celery -A tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule"
    environment:
      PYTHONPATH: /app/vendor:/app:/app/packages/mneme-core:/app/packages/mneme-agent:/app/packages/event-schema
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/mneme
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?需在 .env 设置 MINIO_SECRET_KEY}
      MINIO_BUCKET: mneme
      SMS_PROVIDER: mock
      # beat 导入 celery_app 时也会装配 provider，保持与 api/worker 同源。
      MNEME_LLM: ${MNEME_LLM:-veya}
      VEYA_BASE_URL: ${VEYA_BASE_URL:-http://host.docker.internal:8791/v1}
      VEYA_API_KEY: ${VEYA_API_KEY:-}
      VEYA_MODEL: ${VEYA_MODEL:-veya1.2-128K}
      VEYA_VL_MODEL: ${VEYA_VL_MODEL:-veya1.2-vl}
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    networks:
      - default
      - helios-net

  # Fay 数字人大脑（Phase 3 升级：替代自写 aria_brain，Fay 框架驱动）
  fay:
    build:
      context: ./docker/fay
      dockerfile: Dockerfile
    container_name: mneme-fay
    restart: unless-stopped
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.7-plus}
      VEYA_BASE_URL: ${VEYA_BASE_URL:-http://host.docker.internal:8791/v1}
      VEYA_API_KEY: ${VEYA_API_KEY:-}
      VEYA_MODEL: ${VEYA_MODEL:-veya1.2-128K}
      VEYA_VL_MODEL: ${VEYA_VL_MODEL:-veya1.2-vl}
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:5001:5000"     # Flask GUI/管理（主机 5001 避免冲突）
      - "127.0.0.1:10002:10002"   # WebSocket → 数字人渲染器
      - "127.0.0.1:10003:10003"   # WebSocket → Web 管理面板
    networks:
      - default
      - helios-net

networks:
  default:
  helios-net:
    external: true
  # C4/W2C：Stratum 检索接入。stratum-net 由 Stratum 自己的 docker compose 建，这里
  # 只声明为外部网络供 api 服务加入——不改 Stratum 的 compose、不重复建网络。
  stratum-net:
    external: true

# 外部命名卷：数据显式持久化，且 **`docker compose down -v` 也删不掉**（外部卷不受 compose 管理）。
# 审计 2026-07-03：此前 db 用匿名卷、minio/redis 无卷，一次 down -v 清零了 11646 个 KU
# （后从 D 盘 6-28 备份恢复）。外部化 = 结构性防呆，杜绝重演。
# 注：全新机器首次部署前需先建卷：
#   docker volume create mneme_mneme_pg_data
#   docker volume create mneme_mneme_minio_data
#   docker volume create mneme_mneme_redis_data
volumes:
  mneme_pg_data:
    external: true
    name: mneme_mneme_pg_data
  mneme_minio_data:
    external: true
    name: mneme_mneme_minio_data
  mneme_redis_data:
    external: true
    name: mneme_mneme_redis_data
  # P3: EchoMimic 侧车输出/缓存（非外部卷，compose down -v 可清除）
  mneme_echo_output:
  mneme_echo_cache:
