name: RC7 security qualification

on:
  workflow_dispatch:
  push:
    branches: [release/v0.1.0-rc5]

permissions:
  contents: read
  packages: read

jobs:
  scan-exact-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove EchoMimic scope is not Mneme release runtime
        shell: bash
        run: |
          set -euo pipefail
          test -f .dockerignore
          grep -qxF '.echo' .dockerignore
          ! grep -R --exclude-dir=.git --exclude-dir=.echo -E '(^|[[:space:]])(import|from)[[:space:]]+\.echo' .
          ! grep -E '(^|[[:space:]])(COPY|ADD)[[:space:]].*\.echo' Dockerfile apps/mneme-studio/Dockerfile
          echo 'echo_mimic_release_runtime=NOT_RUNTIME_REACHABLE'
      - id: api_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          image-ref: ghcr.io/soffy88/mneme-api@sha256:52b6f0f0d00b7ba5bb83694939bae06e66ec9ec82168f6322e050d81a39b73af
          format: table
          output: trivy-api.json
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
      - id: frontend_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          image-ref: ghcr.io/soffy88/mneme-web@sha256:b8b9173fc4adbf90932cbec22af343d65225aa40c49b993707e15a107c658cf8
          format: table
          output: trivy-frontend.json
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
      - name: Enforce both image scan results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.api_scan.outcome }}" = success
          test "${{ steps.frontend_scan.outcome }}" = success
      - name: Upload machine-readable scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc8-trivy-reports
          path: |
            trivy-api.json
            trivy-frontend.json
