name: Mneme quality gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mneme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mneme_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mneme_test
          PYTHONPATH: vendor:packages/mneme-core:packages/mneme-agent:packages/event-schema:.
        run: uv run alembic upgrade head
      - name: Run repository quality gate
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mneme_test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mneme_test
        run: ./scripts/check.sh

  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mneme-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mneme-studio/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
      - name: Build Studio
        run: npm run build
