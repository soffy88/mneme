# 本地 dev override：代码目录挂载，保持与生产相同的仓内 chat loop。
# 用 override 文件而非改 docker-compose.yml（后者混有会话前无关改动）。
services:
  api:
    volumes:
      - .:/app
    environment:
      PYTHONPATH: /app/vendor:/app:/app/packages/mneme-core:/app/packages/mneme-agent:/app/packages/event-schema
      MNEME_LLM: veya
      VEYA_BASE_URL: http://host.docker.internal:8791/v1
      VEYA_MODEL: veya1.2-128K
      VEYA_VL_MODEL: veya1.2-vl
